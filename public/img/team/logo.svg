<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007ea7"/>
      <stop offset="100%" style="stop-color:#00a8e8"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#g)" stroke="white" stroke-width="2"/>
  <text x="100" y="30" font-family="Arial Black,sans-serif" font-size="11" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">YAGAZIE WENG UMEZURIKE</text>
  <text x="100" y="175" font-family="Arial Black,sans-serif" font-size="10" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">★ FOUNDATION ★</text>
  <text x="100" y="190" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle" letter-spacing="1">FOR THE DEAF</text>
  <!-- Hand sign (shaka/ILY) simplified -->
  <g transform="translate(60,55) scale(0.9)">
    <ellipse cx="43" cy="70" rx="38" ry="48" fill="white" opacity="0.95"/>
    <!-- thumb -->
    <path d="M12,55 Q4,42 10,32 Q16,24 22,36 L20,55Z" fill="white"/>
    <!-- pinky -->
    <path d="M72,54 Q80,42 76,30 Q70,20 64,34 L66,54Z" fill="white"/>
    <!-- middle fingers folded -->
    <rect x="30" y="38" width="10" height="20" rx="5" fill="#ccc"/>
    <rect x="43" y="34" width="10" height="24" rx="5" fill="#ccc"/>
    <circle cx="30" cy="62" r="10" fill="#ddd"/>
    <circle cx="53" cy="62" r="10" fill="#ddd"/>
    <line x1="10" y1="52" x2="76" y2="52" stroke="#ccc" stroke-width="1"/>
  </g>
</svg>
